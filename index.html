    (function() {

      window.__pendingAuthEventId = null;
      var touchArmState = null;

      function isMobileBrowser() {
        return /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent || '');
      }

      function buildDirectGoogleHandlerUrl(eventId) {
        var redirectUrl = window.location.href.split('#')[0];
        return (
          'https://fuerzadelocultismo.firebaseapp.com/__/auth/handler' +
          '?apiKey=' + encodeURIComponent('AIzaSyC_E1e7vC8tWoQJk0GquRa6CMA-qkgMq_k') +
          '&appName=' + encodeURIComponent('[DEFAULT]') +
          '&authType=' + encodeURIComponent('signInViaPopup') +
          '&redirectUrl=' + encodeURIComponent(redirectUrl) +
          '&v=' + encodeURIComponent('11.9.1') +
          '&eventId=' + encodeURIComponent(eventId) +
          '&providerId=' + encodeURIComponent('google.com') +
          '&customParameters=' + encodeURIComponent('{"prompt":"select_account"}') +
          '&scopes=' + encodeURIComponent('profile')
        );

      window.__openGooglePopupSync = function() {
        try {
          touchArmState = null;
          if (!isMobileBrowser()) return;
          if (window.__pendingAuthPopup && !window.__pendingAuthPopup.closed) {
            return;
          }
          var evId = String(Math.floor(1000000000 + Math.random() * 9000000000));
          var directUrl = buildDirectGoogleHandlerUrl(evId);
          // Abrimos directamente la URL real del handler de Google (nunca about:blank)
          // para que el navegador móvil navegue de inmediato al selector de cuentas de Google.
          var w = origWindowOpen.call(window, directUrl, '_blank');
          if (w) {
            window.__pendingAuthPopup = w;
            window.__pendingAuthEventId = evId;
          }
        } catch (_) {}
      };

      window.__armGooglePopupOnTouch = function(x, y) {
        if (!isMobileBrowser()) return;
        touchArmState = { x: x || 0, y: y || 0, time: Date.now() };
      };

      window.__closePendingGooglePopup = function() {
        try {
          if (window.__pendingAuthPopup && !window.__pendingAuthPopup.closed) {
            window.__pendingAuthPopup.close();
          }
        } catch (_) {}
        window.__pendingAuthPopup = null;
        window.__pendingAuthEventId = null;
        touchArmState = null;
      };

      // En fase bubble (false) para que Flutter procese primero el toque y ejecute onTap
      window.addEventListener('touchend', function(ev) {
        if (!touchArmState) return;
        var state = touchArmState;
        touchArmState = null;
        if (Date.now() - state.time > 1200) return;
        if (ev && ev.changedTouches && ev.changedTouches.length > 0) {
          var t = ev.changedTouches[0];
          var dx = (t.clientX || 0) - state.x;
          var dy = (t.clientY || 0) - state.y;
          if (Math.sqrt(dx * dx + dy * dy) > 24) return;
        }
        window.__openGooglePopupSync();
      }, false);

      window.open = function(url, target, features) {
        if (
          window.__pendingAuthPopup &&
          !window.__pendingAuthPopup.closed &&
          typeof url === 'string' &&
          url.indexOf('/__/auth/handler') !== -1
        ) {
          var w = window.__pendingAuthPopup;
          window.__pendingAuthPopup = null;
          return w;
        }
        return origWindowOpen.apply(window, arguments);
      };

                var syncEventId = window.__pendingAuthEventId;
                window.__pendingAuthEventId = null;
                var authWin = await origOpenPopup.call(this, auth, provider, authType, syncEventId || eventId);
                if (authWin && syncEventId) {
                  try {

                      configurable: true,
                      enumerable: true,
                      get: function() { return null; },
                      set: function(_) {}

                  } catch (_) {}
                }

              };
            }

            if (typeof origInit === 'function') {
              proto._initialize = function(auth) {
                try {
                  var key = auth && typeof auth._key === 'function' ? auth._key() : null;
                  if (key && this.iframes && this.iframes[key]) {
                    var iframeObj = this.iframes[key];
                    var el = typeof iframeObj.getIframeEl === 'function' ? iframeObj.getIframeEl() : null;
                    if (el && !document.body.contains(el)) {
                      delete this.eventManagers[key];
                      delete this.iframes[key];
                    }
                  }
                } catch (_) {}
                return origInit.call(this, auth);
              };
            }
          }
        } catch (_) {}
      }

      var _fbAuthMod = window.firebase_auth;
      if (_fbAuthMod) {
        patchFirebaseAuthModule(_fbAuthMod);
      } else {
        try {

              patchFirebaseAuthModule(val);
            }

        } catch (_) {}
      }
    })();
