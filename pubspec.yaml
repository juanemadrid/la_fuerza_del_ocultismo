name: la_fuerza_del_ocultismo
description: Aplicación de login con tema místico
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.2
  url_launcher: ^6.2.2
  flutter_pdfview: ^1.3.2
  provider: ^6.1.1
  intl: ^0.19.0
  path_provider: ^2.1.1
  http: ^1.1.2
  email_validator: ^2.1.0
  logger: ^2.0.2
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  mockito: ^5.4.4
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
  
