      window.__pendingAuthEventId = null;

        var redirectUrl = window.location.href.split('#')[0];
        return (
          'https://fuerzadelocultismo.firebaseapp.com/__/auth/handler' +
          '?apiKey=' + encodeURIComponent('AIzaSyC_E1e7vC8tWoQJk0GquRa6CMA-qkgMq_k') +

          '&redirectUrl=' + encodeURIComponent(redirectUrl) +

          '&eventId=' + encodeURIComponent(eventId) +
          '&providerId=' + encodeURIComponent('google.com') +
          '&customParameters=' + encodeURIComponent('{"prompt":"select_account"}') +
          '&scopes=' + encodeURIComponent('profile')

      window.__openGooglePopupSync = function() {
        try {
          if (!isMobileBrowser()) return;
          if (window.__pendingAuthPopup && !window.__pendingAuthPopup.closed) {
            return;
          }
          var evId = String(Math.floor(1000000000 + Math.random() * 9000000000));

          var w = origWindowOpen.call(window, directUrl, '_blank');

            window.__pendingAuthPopup = w;
            window.__pendingAuthEventId = evId;
          }
        } catch (_) {}
      };

      window.__armGooglePopupOnTouch = function(x, y) {
        if (!isMobileBrowser()) return;
        touchArmState = { x: x || 0, y: y || 0, time: Date.now() };
      };

      window.__closePendingGooglePopup = function() {
        try {
          if (window.__pendingAuthPopup && !window.__pendingAuthPopup.closed) {
            window.__pendingAuthPopup.close();
          }
        } catch (_) {}
        window.__pendingAuthPopup = null;
        window.__pendingAuthEventId = null;
        touchArmState = null;
      };

        if (!touchArmState) return;
        var state = touchArmState;
        touchArmState = null;
        if (Date.now() - state.time > 1500) return;
        if (ev && ev.changedTouches && ev.changedTouches.length > 0) {
          var t = ev.changedTouches[0];
          var dx = (t.clientX || 0) - state.x;
          var dy = (t.clientY || 0) - state.y;
          if (Math.sqrt(dx * dx + dy * dy) > 24) return;
        }
        window.__openGooglePopupSync();
        if (typeof window.__triggerDartGoogleSignIn === 'function') {
          var fn = window.__triggerDartGoogleSignIn;
          window.__triggerDartGoogleSignIn = null;
          fn();

        if (
          window.__pendingAuthPopup &&
          !window.__pendingAuthPopup.closed &&
          typeof url === 'string' &&
          url.indexOf('/__/auth/handler') !== -1

          var w = window.__pendingAuthPopup;
          window.__pendingAuthPopup = null;
          return w;
        }
        return origWindowOpen.apply(window, arguments);
      };

        if (!manager) return manager;
        var proto = manager.constructor ? manager.constructor.prototype : manager;

              consumer.filter &&

          var origOnEvent = proto.onEvent;
          proto.onEvent = function(event) {
            var handled = origOnEvent.call(this, event);
            if (!handled && event && (event.type === 'signInViaPopup' || event.type === 'linkViaPopup' || event.type === 'reauthViaPopup')) {
              this._queuedPopupEvent = event;
              return true;
            }
            return handled;
          };

          var origRegister = proto.registerConsumer;
          proto.registerConsumer = function(consumer) {
            origRegister.call(this, consumer);
            if (this._queuedPopupEvent && this.isEventForConsumer(this._queuedPopupEvent, consumer)) {
              var ev = this._queuedPopupEvent;
              this._queuedPopupEvent = null;
              this.sendToConsumer(ev, consumer);
              this.saveEventToCache(ev);
            }
          };
        }
        return manager;
      }

          var proto = resolver && resolver.prototype;

            var origInitAndGet = proto.initAndGetManager;
            if (typeof origInitAndGet === 'function') {
              proto.initAndGetManager = async function(auth) {
                var manager = await origInitAndGet.call(this, auth);

            }

            var origInit = proto._initialize;
            if (typeof origInit === 'function') {
              proto._initialize = async function(auth) {
                var manager = await origInit.call(this, auth);

              };
            }

            var origOpenPopup = proto._openPopup;
            if (typeof origOpenPopup === 'function') {
              proto._openPopup = async function(auth, provider, authType, eventId) {
                if (window.__pendingAuthPopup && !window.__pendingAuthPopup.closed) {
                  var w = window.__pendingAuthPopup;
                  window.__pendingAuthPopup = null;
                  window.__pendingAuthEventId = null;
                  var authWin = {
                    window: w,
                    close: function() {
                      if (this.window) {
                        try { this.window.close(); } catch (_) {}
                      }
                    }

                  Object.defineProperty(authWin, 'associatedEvent', {
                    configurable: true,
                    enumerable: true,
                    get: function() { return null; },
                    set: function(_) {}

                  return authWin;
                }
                return origOpenPopup.call(this, auth, provider, authType, eventId);
              };
            }

        } catch (_) {}
      }
