<!DOCTYPE html>
<html lang="es">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="La Fuerza del Ocultismo - Rituales, horóscopo, limpiezas y más. Tu guía espiritual en línea.">
  <meta name="keywords" content="ocultismo, rituales, horóscopo, limpiezas, espiritual, tarot">
  <meta name="theme-color" content="#000000">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="La Fuerza del Ocultismo">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>La Fuerza del Ocultismo</title>
  <link rel="manifest" href="manifest.json">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { background: #000000; width: 100%; height: 100%; overflow: hidden; }
  </style>
</head>
<body>
  <!-- DIAGNÓSTICO TEMPORAL: muestra errores en pantalla (para iPhone). Quitar cuando se resuelva. -->
  <div id="diag" style="display:none;position:fixed;left:0;right:0;bottom:0;max-height:45%;overflow:auto;z-index:2147483647;background:rgba(0,0,0,.9);color:#ff6b6b;font:11px/1.35 monospace;padding:8px;white-space:pre-wrap;word-break:break-word;border-top:2px solid #ff6b6b"></div>
  <script>
  (function () {
    var t0 = Date.now();
    function show(m) {
      try {
        var d = document.getElementById('diag');
        if (!d) return;
        d.style.display = 'block';
        d.textContent += '[' + ((Date.now() - t0) / 1000).toFixed(1) + 's] ' + String(m).slice(0, 600) + '\n';
      } catch (_) {}
    }
    window.addEventListener('error', function (e) {
      show('ERR: ' + (e.message || (e.target && (e.target.src || e.target.href)) || e));
    }, true);
    window.addEventListener('unhandledrejection', function (e) {
      var r = e.reason; show('PROMISE: ' + ((r && (r.message || r.toString())) || r));
    });
    var gc = HTMLCanvasElement.prototype.getContext;
    HTMLCanvasElement.prototype.getContext = function (type) {
      if (!this.__diag) {
        this.__diag = true;
        this.addEventListener('webglcontextlost', function () { show('WEBGL CONTEXT LOST (' + type + ')'); });
        this.addEventListener('webglcontextrestored', function () { show('webgl restored'); });
      }
      return gc.apply(this, arguments);
    };
    var oe = console.error, ol = console.log;
    console.error = function () {
      try { show('CONSOLE: ' + Array.prototype.join.call(arguments, ' ')); } catch (_) {}
      return oe.apply(console, arguments);
    };
    console.log = function () {
      try {
        var s = Array.prototype.join.call(arguments, ' ');
        if (s.indexOf('DIAG_ERROR') >= 0 || s.indexOf('splash') >= 0) show(s);
      } catch (_) {}
      return ol.apply(console, arguments);
    };
    // Captura el error REAL de Firebase Auth (el plugin de Flutter lo oculta en iPhone)
    try {
      var realAuth;
      Object.defineProperty(window, 'firebase_auth', {
        configurable: true,
        get: function () { return realAuth; },
        set: function (m) {
          var w = {};
          Object.keys(m).forEach(function (k) {
            var v = m[k];
            if (typeof v === 'function' && /^[a-z]/.test(k) && !/Persistence|Resolver|ErrorMap/.test(k)) {
              w[k] = function () {
                try {
                  var r = v.apply(this, arguments);
                  if (r && typeof r.then === 'function') {
                    r.then(null, function (e) {
                      show('AUTH ' + k + ' rechazo: ' + (e && e.code ? e.code + ' ' : '') + (e && e.message) + ' | ' + String(e && e.stack || '').slice(0, 300));
                    });
                  }
                  return r;
                } catch (e) {
                  show('AUTH ' + k + ' fallo: ' + (e && e.code ? e.code + ' ' : '') + (e && e.message) + ' | ' + String(e && e.stack || '').slice(0, 300));
                  throw e;
                }
              };
            } else {
              w[k] = v;
            }
          });
          realAuth = w;
        }
      });
    } catch (e) { show('probe auth no instalado: ' + e); }
    document.addEventListener('visibilitychange', function () { if (document.hidden) show('page hidden'); });
    setTimeout(function () { show('diag activo: ' + navigator.userAgent); document.getElementById('diag').style.display = 'none'; }, 50);
  })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
