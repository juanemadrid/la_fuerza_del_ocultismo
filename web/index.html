<!DOCTYPE html>
<html lang="es">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="La Fuerza del Ocultismo - Rituales, horóscopo, limpiezas y más. Tu guía espiritual en línea.">
  <meta name="keywords" content="ocultismo, rituales, horóscopo, limpiezas, espiritual, tarot">
  <meta name="theme-color" content="#000000">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="La Fuerza del Ocultismo">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { background: #000000; width: 100%; height: 100%; overflow: hidden; }
  </style>
</head>
<body>
  <!--
    Carga de Firebase directamente desde la página (antes de arrancar Flutter).
    En iPhone (Safari/WebKit) la carga automática que hace el plugin de Flutter
    no dejaba disponible el módulo de autenticación y la app quedaba en negro.
    Si estas variables ya existen, el plugin de Firebase no intenta cargarlas de nuevo.
    La versión debe coincidir con la que usa el plugin firebase_core_web.
  -->
  <script type="module">
    const V = '11.9.1';
    const base = 'https://www.gstatic.com/firebasejs/' + V + '/';
    const diag = (m) => { try { console.warn('Firebase: ' + m); } catch (_) {} };
    try {
      const [core, auth, firestore, storage] = await Promise.all([
        import(base + 'firebase-app.js'),
        import(base + 'firebase-auth.js'),
        import(base + 'firebase-firestore.js'),
        import(base + 'firebase-storage.js'),
      ]);
      window.firebase_core = core;
      window.firebase_auth = auth;
      window.firebase_firestore = firestore;
      window.firebase_storage = storage;
    } catch (e) {
      // Si algo falla aquí, el plugin intentará cargar Firebase por su cuenta.
      delete window.firebase_core;
      diag('carga Firebase en index: ' + (e && e.message ? e.message : e));
    }
    const s = document.createElement('script');
    s.src = 'flutter_bootstrap.js';
    s.async = true;
    document.body.appendChild(s);
  </script>
</body>
</html>
